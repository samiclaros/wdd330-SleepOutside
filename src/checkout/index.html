<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="dynamicHeader"></header>

    <main class="divider">
      <section class="productsCheckout">
        <h2>Review & Place your Order</h2>

        <div class="form-container">
          <form id="checkout" name="checkout">
            <fieldset>
              <legend>Customer Name</legend>
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname" autocomplete="given-name" pattern=".*\S.*"  title="Please enter your first name." required />

              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lname" autocomplete="family-name" pattern=".*\S.*"  title="Please enter your last name." required />
            </fieldset>

            <fieldset>
              <legend>Shipping Adress</legend>
              <label for="street">Street Adress</label>
              <input type="text" name="street" id="street" autocomplete="street-address"  pattern=".*\S.*"  required />

              <label for="city">City</label>
              <input type="text" name="city" id="city" autocomplete="address-level2" pattern=".*\S.*"  title="Please enter your city." required />

              <label for="state">State</label>
              <input type="text" name="state" id="state"  autocomplete="address-level1" pattern="[A-Za-z]{2}" title="Enter a two letter US state abbreviation"  minlength="2" maxlength="2" placeholder="ID" required />

              <label for="zip">Zip Code</label>
              <input type="text" name="zip" id="zip" autocomplete="postal-code" inputmode="numeric"  minlength="5" maxlength="10"   pattern="[0-9]{5}(-[0-9]{4})?" placeholder="83440"  title="Enter a valid ZIP code, such as 83440 or 83440-1234." required />
            </fieldset>

            <fieldset>
              <legend>Payment Information</legend>
              <label for="cardNumber">Credit Card Number</label>
              <input type="text" name="cardNumber" id="cardNumber" inputmode="numeric" minlength="16" maxlength="16"   pattern="[0-9]{16}" autocomplete="off"    title="Enter exactly 16 digits without spaces." required />

              <label for="expiration">Expiration Date</label>
              <input type="text" name="expiration" id="expiration" minlength="5" maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}"   placeholder="MM/YY" autocomplete="off" title="Enter a valid expiration date (MM/YY)." required />

              <label for="code">Security Code</label>
              <input type="text" name="code" id="code"  inputmode="numeric" minlength="3" maxlength="4" pattern="[0-9]{3,4}" autocomplete="off" title="Enter the 3 or 4 digit security code." required />
            </fieldset>
          </form>

          <!-- This part goes with Step 4: Order Summary -->
          <section class="order-summary">
            <h3>Order Summary</h3>
            <p>Subtotal: <span id="subtotal"></span></p>
            <p>Tax: <span id="tax"></span></p>
            <p>Shipping Estimate: <span id="shipping"></span></p>
            <p>Order Total: <span id="orderTotal"></span></p>
          </section>
          <button type="submit" id="checkoutSubmit">Checkout</button>
        </div>
      </section>
    </main>

    <footer id="dynamicFooter"></footer>
  </body>
</html>
